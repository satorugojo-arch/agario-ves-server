<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAGABOLÍVARES VES</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #03060d; font-family: sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background-color: #070c18; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #topProgressContainer {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 480px;
            background: rgba(10, 15, 30, 0.92); border: 2px solid #00d2ff44; border-radius: 12px;
            padding: 8px 15px; z-index: 5; text-align: center; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }
        .progress-title { color: #fff; font-size: 12px; font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar-bg { width: 100%; height: 14px; background: #0f172a; border-radius: 7px; overflow: hidden; border: 1px solid #1e293b; }
        #progressBarFill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0055, #00d2ff, #00ff88); transition: width 0.3s ease; }
        #hudStatusText { font-size: 11px; color: #ff3366; font-weight: bold; margin-top: 4px; }
        
        #leaderboardBox {
            position: absolute; top: 15px; right: 15px; width: 190px; background: rgba(10, 15, 30, 0.92);
            border: 1px solid #00d2ff44; border-radius: 10px; padding: 10px; color: #fff; z-index: 5; font-size: 12px;
        }
        #leaderboardBox h4 { color: #00ff88; text-align: center; margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        .lb-item { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
        .
